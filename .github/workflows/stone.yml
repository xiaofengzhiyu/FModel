name: FModel QA STONE Builder

on:
  workflow_dispatch:
    inputs:
        buildConfig:
          description: '构建配置'
          required: true
          default: 'Release'
          type: choice
          options:
            - Release
            - Debug
        runtimeIdentifier:
          description: '运行时标识'
          required: true
          default: 'win-x64'
          type: choice
          options:
            - win-x64
        publishSingleFile:
          description: '是否发布为单文件'
          required: true
          default: true
          type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: .NET 8 Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: .NET Restore
        run: dotnet restore ./FModel/FModel.csproj

      - name: .NET Publish
        run: dotnet publish "./FModel/FModel.csproj" -c ${{ github.event.inputs.buildConfig }} --no-restore --no-self-contained -r ${{ github.event.inputs.runtimeIdentifier }} -f net8.0-windows -o "./FModel/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=${{ github.event.inputs.publishSingleFile }} -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false

      - name: ZIP File
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ${{ github.sha }}.zip # will end up in working directory not the Publish folder
          path: ./FModel/bin/Publish/FModel.exe

      - name: Edit QA Artifact
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 'FModel QA Testing'
          body: 'QA Dev builds'
          tag: 'stone'
          artifacts: ${{ github.sha }}.zip
          prerelease: true
          allowUpdates: true

      - name: Get Version
        id: package_version
        uses: kzrnm/get-net-sdk-project-versions-action@v2
        with:
          proj-path: ./FModel/FModel.csproj

      - name: FModel Deploy Build
        run: |
          echo '{"version": "${{ steps.package_version.outputs.version }}-dev+${{ github.sha }}", "downloadUrl": "https://github.com/xiaofengzhiyu/FModel/releases/download/stone/${{ github.sha }}.zip"}'
